[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pts-reproduction"
version = "0.1.0"
description = "Independent reproduction of Path-preserving Time Scaling (arXiv:2611.01390)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2", "scipy>=1.10", "PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../ForceBenchWeb"]

